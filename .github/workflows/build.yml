name: Build and test

on:
  push:
    branches: [paneles]
  pull_request:
    branches: [paneles]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Cultos.sln
      - name: Build
        run: dotnet build Cultos.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/Cultos.Tests/Cultos.Tests.csproj --configuration Release --no-build --verbosity normal
